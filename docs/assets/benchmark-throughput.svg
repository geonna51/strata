<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="bar-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#010409" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="440" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">STRATA THROUGHPUT BENCHMARK (OPS/SEC)</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#8b949e">100,000 Operations &bull; 100-Byte Values &bull; Apple Silicon &bull; Higher is Better</text>

  <!-- Chart Area -->
  <g transform="translate(190, 80)">

    <!-- Vertical Grid Lines (Log scale or custom scale: max is 7.5M, width 620px) -->
    <!-- Scale: x = (ops / 7,500,000) * 580 -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#30363d" stroke-width="1.5"/>
    <line x1="155" y1="0" x2="155" y2="300" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="310" y1="0" x2="310" y2="300" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="464" y1="0" x2="464" y2="300" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="580" y1="0" x2="580" y2="300" stroke="#21262d" stroke-dasharray="3 3"/>

    <!-- Grid Labels -->
    <text x="0" y="320" text-anchor="middle" font-size="10" fill="#8b949e">0</text>
    <text x="155" y="320" text-anchor="middle" font-size="10" fill="#8b949e">2.0M</text>
    <text x="310" y="320" text-anchor="middle" font-size="10" fill="#8b949e">4.0M</text>
    <text x="464" y="320" text-anchor="middle" font-size="10" fill="#8b949e">6.0M</text>
    <text x="580" y="320" text-anchor="middle" font-size="10" fill="#8b949e">7.5M</text>

    <!-- Row 1: Read Missing (Bloom Filter) -> 7,021,999 ops/sec (x = 543) -->
    <g transform="translate(0, 10)">
      <text x="-15" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#7ee787">Read Missing (Bloom)</text>
      <rect x="0" y="8" width="543" height="24" rx="4" fill="url(#bar-green)" filter="url(#shadow)"/>
      <text x="553" y="25" font-size="12" font-weight="700" fill="#7ee787">7,021,999 ops/s (107 MB/s)</text>
    </g>

    <!-- Row 2: Read Sequential (Range Scan) -> 1,695,389 ops/sec (x = 131) -->
    <g transform="translate(0, 60)">
      <text x="-15" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#58a6ff">Read Sequential</text>
      <rect x="0" y="8" width="131" height="24" rx="4" fill="url(#bar-blue)" filter="url(#shadow)"/>
      <text x="141" y="25" font-size="12" font-weight="700" fill="#58a6ff">1,695,389 ops/s (184 MB/s)</text>
    </g>

    <!-- Row 3: Read Random (Warm Cache) -> 1,113,525 ops/sec (x = 86) -->
    <g transform="translate(0, 110)">
      <text x="-15" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#58a6ff">Read Random (Warm)</text>
      <rect x="0" y="8" width="86" height="24" rx="4" fill="url(#bar-blue)" filter="url(#shadow)"/>
      <text x="96" y="25" font-size="12" font-weight="700" fill="#58a6ff">1,113,525 ops/s (121 MB/s)</text>
    </g>

    <!-- Row 4: Read Random (Cold Cache) -> 866,685 ops/sec (x = 67) -->
    <g transform="translate(0, 160)">
      <text x="-15" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#bc8cff">Read Random (Cold)</text>
      <rect x="0" y="8" width="67" height="24" rx="4" fill="url(#bar-purple)" filter="url(#shadow)"/>
      <text x="77" y="25" font-size="12" font-weight="700" fill="#bc8cff">866,685 ops/s (94 MB/s)</text>
    </g>

    <!-- Row 5: Write Random -> 134,213 ops/sec (x = 22) -->
    <g transform="translate(0, 210)">
      <text x="-15" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#e3b341">Write Random</text>
      <rect x="0" y="8" width="22" height="24" rx="4" fill="url(#bar-orange)" filter="url(#shadow)"/>
      <text x="32" y="25" font-size="12" font-weight="700" fill="#e3b341">134,213 ops/s (15 MB/s)</text>
    </g>

    <!-- Row 6: Write Sequential -> 122,003 ops/sec (x = 20) -->
    <g transform="translate(0, 260)">
      <text x="-15" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#e3b341">Write Sequential</text>
      <rect x="0" y="8" width="20" height="24" rx="4" fill="url(#bar-orange)" filter="url(#shadow)"/>
      <text x="30" y="25" font-size="12" font-weight="700" fill="#e3b341">122,003 ops/s (13 MB/s)</text>
    </g>

  </g>
</svg>
