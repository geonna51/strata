<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-data" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-filter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-index" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-footer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f85149" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">STRATA SSTABLE BINARY FORMAT</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#8b949e">Immutable Sorted String Table Layout &bull; 4KB Data Blocks &bull; Bloom Filter &bull; 48-Byte Fixed Footer</text>

  <!-- Main Container Layout -->
  <g transform="translate(40, 80)">

    <!-- Table Outline Box -->
    <rect x="0" y="0" width="820" height="440" rx="12" fill="url(#grad-card)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Left Column: File Layout Stack (0 to file_size) -->
    <g transform="translate(25, 25)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#58a6ff" letter-spacing="1">PHYSICAL FILE LAYOUT</text>

      <!-- Data Block 0 -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="220" height="55" rx="6" fill="url(#grad-data)" stroke="#388bfd" stroke-width="1.5"/>
        <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#f0f6fc">Data Block 0</text>
        <text x="110" y="42" text-anchor="middle" font-size="10" fill="#8b949e">4KB &bull; Prefix Encoded Keys &bull; CRC32</text>
      </g>

      <!-- Data Block 1 -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="220" height="42" rx="6" fill="url(#grad-data)" stroke="#388bfd" stroke-width="1"/>
        <text x="110" y="26" text-anchor="middle" font-size="12" font-weight="500" fill="#c9d1d9">Data Block 1</text>
      </g>

      <!-- Ellipsis -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="220" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-dasharray="3 3"/>
        <text x="110" y="16" text-anchor="middle" font-size="11" fill="#8b949e">&bull; &bull; &bull;</text>
      </g>

      <!-- Data Block N -->
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="220" height="42" rx="6" fill="url(#grad-data)" stroke="#388bfd" stroke-width="1"/>
        <text x="110" y="26" text-anchor="middle" font-size="12" font-weight="500" fill="#c9d1d9">Data Block N</text>
      </g>

      <!-- Filter Block -->
      <g transform="translate(0, 204)">
        <rect x="0" y="0" width="220" height="50" rx="6" fill="url(#grad-filter)" stroke="#2ea043" stroke-width="1.5"/>
        <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#7ee787">Filter Block</text>
        <text x="110" y="40" text-anchor="middle" font-size="10" fill="#8b949e">MurmurHash3 Bloom Bits &bull; 10 bpk</text>
      </g>

      <!-- Index Block -->
      <g transform="translate(0, 260)">
        <rect x="0" y="0" width="220" height="50" rx="6" fill="url(#grad-index)" stroke="#a371f7" stroke-width="1.5"/>
        <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#d2a8ff">Index Block</text>
        <text x="110" y="40" text-anchor="middle" font-size="10" fill="#8b949e">Separator Keys &bull; Block Handles</text>
      </g>

      <!-- Footer -->
      <g transform="translate(0, 316)">
        <rect x="0" y="0" width="220" height="65" rx="6" fill="url(#grad-footer)" stroke="#f85149" stroke-width="2"/>
        <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ff7b72">Footer (48 Bytes)</text>
        <text x="110" y="42" text-anchor="middle" font-size="10" fill="#ffa198">Metaindex Handle (16B) &bull; Index Handle (16B)</text>
        <text x="110" y="56" text-anchor="middle" font-size="10" font-family="SFMono-Regular, Consolas, monospace" fill="#8b949e">Magic: 0xdb4772617461</text>
      </g>
    </g>

    <!-- Right Side Detail 1: Inside Data Block (Top Right) -->
    <g transform="translate(280, 25)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#58a6ff" letter-spacing="1">INTERNAL 4KB DATA BLOCK STRUCTURE</text>
      <rect x="0" y="15" width="495" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

      <!-- Entry Item Details -->
      <g transform="translate(15, 30)">
        <rect x="0" y="0" width="145" height="60" rx="5" fill="#21262d" stroke="#388bfd" stroke-width="1"/>
        <text x="72" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff">Entry Header</text>
        <text x="72" y="36" text-anchor="middle" font-size="9" fill="#8b949e">shared_len (varint32)</text>
        <text x="72" y="48" text-anchor="middle" font-size="9" fill="#8b949e">non_shared_len &bull; val_len</text>

        <rect x="155" y="0" width="145" height="60" rx="5" fill="#21262d" stroke="#388bfd" stroke-width="1"/>
        <text x="227" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff">Payload</text>
        <text x="227" y="36" text-anchor="middle" font-size="9" fill="#8b949e">Key Delta (bytes)</text>
        <text x="227" y="48" text-anchor="middle" font-size="9" fill="#8b949e">Seq (7B) + Type (1B) + Value</text>

        <rect x="310" y="0" width="145" height="60" rx="5" fill="#21262d" stroke="#8957e5" stroke-width="1"/>
        <text x="382" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#d2a8ff">Restart Array</text>
        <text x="382" y="36" text-anchor="middle" font-size="9" fill="#8b949e">Offsets: uint32[num_restarts]</text>
        <text x="382" y="48" text-anchor="middle" font-size="9" fill="#8b949e">Restart Interval = 16 keys</text>
      </g>

      <!-- Explanation Row -->
      <g transform="translate(15, 105)">
        <rect x="0" y="0" width="455" height="45" rx="5" fill="#0d1117" stroke="#21262d"/>
        <text x="12" y="18" font-size="10" fill="#c9d1d9">&bull; Binary search within block evaluates restart points first, avoiding O(N) full block scans.</text>
        <text x="12" y="34" font-size="10" fill="#c9d1d9">&bull; Block trailer appends 1-byte compression type (uncompressed) + 4-byte CRC32 checksum.</text>
      </g>
    </g>

    <!-- Right Side Detail 2: 48-Byte Footer Breakdown (Bottom Right) -->
    <g transform="translate(280, 205)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#ff7b72" letter-spacing="1">48-BYTE FOOTER BYTE LAYOUT</text>
      <rect x="0" y="15" width="495" height="175" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

      <!-- Footer Byte Slices -->
      <g transform="translate(15, 30)">
        <!-- Filter Handle -->
        <rect x="0" y="0" width="110" height="70" rx="5" fill="#21262d" stroke="#2ea043" stroke-width="1"/>
        <text x="55" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#7ee787">Filter Handle</text>
        <text x="55" y="38" text-anchor="middle" font-size="10" fill="#8b949e">Bytes 0..15</text>
        <text x="55" y="52" text-anchor="middle" font-size="9" fill="#c9d1d9">offset (8B)</text>
        <text x="55" y="64" text-anchor="middle" font-size="9" fill="#c9d1d9">size (8B)</text>

        <!-- Index Handle -->
        <rect x="118" y="0" width="110" height="70" rx="5" fill="#21262d" stroke="#a371f7" stroke-width="1"/>
        <text x="173" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#d2a8ff">Index Handle</text>
        <text x="173" y="38" text-anchor="middle" font-size="10" fill="#8b949e">Bytes 16..31</text>
        <text x="173" y="52" text-anchor="middle" font-size="9" fill="#c9d1d9">offset (8B)</text>
        <text x="173" y="64" text-anchor="middle" font-size="9" fill="#c9d1d9">size (8B)</text>

        <!-- Zero Padding -->
        <rect x="236" y="0" width="100" height="70" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="286" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#8b949e">Zero Padding</text>
        <text x="286" y="38" text-anchor="middle" font-size="10" fill="#8b949e">Bytes 32..39</text>
        <text x="286" y="58" text-anchor="middle" font-size="10" font-family="SFMono-Regular, Consolas, monospace" fill="#8b949e">0x00 &times; 8</text>

        <!-- Magic Number -->
        <rect x="344" y="0" width="125" height="70" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
        <text x="406" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#ff7b72">Magic Number</text>
        <text x="406" y="38" text-anchor="middle" font-size="10" fill="#8b949e">Bytes 40..47</text>
        <text x="406" y="54" text-anchor="middle" font-size="9" font-family="SFMono-Regular, Consolas, monospace" fill="#f0f6fc">0xdb4772617461</text>
        <text x="406" y="65" text-anchor="middle" font-size="8" fill="#ffa198">ASCII: 'Grata'</text>
      </g>

      <!-- Bottom Reader Note -->
      <g transform="translate(15, 115)">
        <rect x="0" y="0" width="465" height="58" rx="5" fill="#0d1117" stroke="#21262d"/>
        <text x="12" y="20" font-size="10.5" fill="#8b949e">Fast Reader Initialization: Reader reads exactly the last 48 bytes via single <tspan fill="#58a6ff" font-family="monospace">pread()</tspan>.</text>
        <text x="12" y="36" font-size="10.5" fill="#8b949e">Magic number validation precedes loading the index &amp; Bloom filter blocks.</text>
        <text x="12" y="50" font-size="10.5" fill="#8b949e">Zero full-file scans required to discover file index structure.</text>
      </g>
    </g>

  </g>
</svg>
