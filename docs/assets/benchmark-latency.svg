<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#010409" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="440" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">STRATA LATENCY DISTRIBUTION (MICROSECONDS)</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#8b949e">Percentiles p50 &bull; p95 &bull; p99 &bull; Lower is Better</text>

  <!-- Legend -->
  <g transform="translate(320, 78)">
    <!-- p50 -->
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#388bfd"/>
    <text x="22" y="12" font-size="11" font-weight="500" fill="#c9d1d9">p50 (Median)</text>

    <!-- p95 -->
    <rect x="110" y="0" width="14" height="14" rx="3" fill="#d29922"/>
    <text x="132" y="12" font-size="11" font-weight="500" fill="#c9d1d9">p95</text>

    <!-- p99 -->
    <rect x="180" y="0" width="14" height="14" rx="3" fill="#f85149"/>
    <text x="202" y="12" font-size="11" font-weight="500" fill="#c9d1d9">p99 (Tail)</text>
  </g>

  <!-- Chart Area -->
  <g transform="translate(190, 115)">
    <!-- Scale: 0 to 15 us, width = 560px -> 37.3 px / us -->
    <line x1="0" y1="0" x2="0" y2="260" stroke="#30363d" stroke-width="1.5"/>
    <line x1="112" y1="0" x2="112" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="224" y1="0" x2="224" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="336" y1="0" x2="336" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="448" y1="0" x2="448" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>
    <line x1="560" y1="0" x2="560" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>

    <!-- Grid Labels -->
    <text x="0" y="278" text-anchor="middle" font-size="10" fill="#8b949e">0 µs</text>
    <text x="112" y="278" text-anchor="middle" font-size="10" fill="#8b949e">3 µs</text>
    <text x="224" y="278" text-anchor="middle" font-size="10" fill="#8b949e">6 µs</text>
    <text x="336" y="278" text-anchor="middle" font-size="10" fill="#8b949e">9 µs</text>
    <text x="448" y="278" text-anchor="middle" font-size="10" fill="#8b949e">12 µs</text>
    <text x="560" y="278" text-anchor="middle" font-size="10" fill="#8b949e">15 µs</text>

    <!-- Group 1: Write Random (p50: 3.21us=120px, p95: 4.50us=168px, p99: 7.71us=288px) -->
    <g transform="translate(0, 5)">
      <text x="-15" y="28" text-anchor="end" font-size="12" font-weight="600" fill="#c9d1d9">Write Random</text>
      <rect x="0" y="2" width="120" height="12" rx="3" fill="#388bfd"/>
      <text x="128" y="12" font-size="10" fill="#8b949e">3.21 µs</text>

      <rect x="0" y="17" width="168" height="12" rx="3" fill="#d29922"/>
      <text x="176" y="27" font-size="10" fill="#8b949e">4.50 µs</text>

      <rect x="0" y="32" width="288" height="12" rx="3" fill="#f85149"/>
      <text x="296" y="42" font-size="10" font-weight="600" fill="#f85149">7.71 µs</text>
    </g>

    <!-- Group 2: Write Sequential (p50: 3.12us=116px, p95: 5.46us=204px, p99: 9.96us=372px) -->
    <g transform="translate(0, 55)">
      <text x="-15" y="28" text-anchor="end" font-size="12" font-weight="600" fill="#c9d1d9">Write Sequential</text>
      <rect x="0" y="2" width="116" height="12" rx="3" fill="#388bfd"/>
      <text x="124" y="12" font-size="10" fill="#8b949e">3.12 µs</text>

      <rect x="0" y="17" width="204" height="12" rx="3" fill="#d29922"/>
      <text x="212" y="27" font-size="10" fill="#8b949e">5.46 µs</text>

      <rect x="0" y="32" width="372" height="12" rx="3" fill="#f85149"/>
      <text x="380" y="42" font-size="10" font-weight="600" fill="#f85149">9.96 µs</text>
    </g>

    <!-- Group 3: Read Cold / Disk (p50: 0.67us=25px, p95: 1.08us=40px, p99: 13.62us=508px) -->
    <g transform="translate(0, 105)">
      <text x="-15" y="28" text-anchor="end" font-size="12" font-weight="600" fill="#bc8cff">Read Cold (Disk)</text>
      <rect x="0" y="2" width="25" height="12" rx="3" fill="#388bfd"/>
      <text x="33" y="12" font-size="10" fill="#8b949e">0.67 µs</text>

      <rect x="0" y="17" width="40" height="12" rx="3" fill="#d29922"/>
      <text x="48" y="27" font-size="10" fill="#8b949e">1.08 µs</text>

      <rect x="0" y="32" width="508" height="12" rx="3" fill="#f85149"/>
      <text x="516" y="42" font-size="10" font-weight="600" fill="#f85149">13.62 µs</text>
    </g>

    <!-- Group 4: Read Random Cached (p50: 0.83us=31px, p95: 1.25us=47px, p99: 1.58us=59px) -->
    <g transform="translate(0, 155)">
      <text x="-15" y="28" text-anchor="end" font-size="12" font-weight="600" fill="#58a6ff">Read Random (Warm)</text>
      <rect x="0" y="2" width="31" height="12" rx="3" fill="#388bfd"/>
      <text x="39" y="12" font-size="10" fill="#8b949e">0.83 µs</text>

      <rect x="0" y="17" width="47" height="12" rx="3" fill="#d29922"/>
      <text x="55" y="27" font-size="10" fill="#8b949e">1.25 µs</text>

      <rect x="0" y="32" width="59" height="12" rx="3" fill="#f85149"/>
      <text x="67" y="42" font-size="10" font-weight="600" fill="#f85149">1.58 µs</text>
    </g>

    <!-- Group 5: Read Missing (p50: 0.08us=3px, p95: 0.08us=3px, p99: 0.08us=3px) -->
    <g transform="translate(0, 205)">
      <text x="-15" y="28" text-anchor="end" font-size="12" font-weight="600" fill="#7ee787">Read Missing (Bloom)</text>
      <rect x="0" y="2" width="8" height="12" rx="3" fill="#388bfd"/>
      <text x="16" y="12" font-size="10" fill="#8b949e">0.08 µs</text>

      <rect x="0" y="17" width="8" height="12" rx="3" fill="#d29922"/>
      <text x="16" y="27" font-size="10" fill="#8b949e">0.08 µs</text>

      <rect x="0" y="32" width="8" height="12" rx="3" fill="#f85149"/>
      <text x="16" y="42" font-size="10" font-weight="600" fill="#f85149">0.08 µs</text>
    </g>

  </g>
</svg>
